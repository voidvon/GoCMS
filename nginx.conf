server
{
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name www.test.com;
  index index.html index.htm default.htm default.html;
  root /www/wwwroot/www.bilvie.com/gocms;

  # 宝塔/面板扩展配置
  include /www/server/panel/vhost/nginx/extension/gocms/*.conf;

  # CERT-APPLY-CHECK--START
  # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
  include /www/server/panel/vhost/nginx/well-known/gocms.conf;
  # CERT-APPLY-CHECK--END

  # SSL-START SSL相关配置
  ssl_certificate        /www/server/panel/vhost/cert/gocms/fullchain.pem;
  ssl_certificate_key    /www/server/panel/vhost/cert/gocms/privkey.pem;
  ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  error_page 497 https://$host$request_uri;

  # HTTP_TO_HTTPS_START
  if ($server_port !~ 443){
      rewrite ^(/.*)$ https://$host$1 permanent;
  }
  # HTTP_TO_HTTPS_END
  # SSL-END

  # Gzip 压缩（显著加速 HTML、CSS、JS 及 SVG 加载）
  gzip on;
  gzip_min_length 1k;
  gzip_buffers 4 16k;
  gzip_http_version 1.1;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_vary on;
  gzip_proxied any;

  # REWRITE-START 伪静态相关配置
  include /www/server/panel/vhost/rewrite/go_gocms.conf;
  # REWRITE-END

  # 一键申请SSL证书验证目录相关设置
  location /.well-known/ {
      root /www/wwwroot/java_node_ssl;
  }

  # 禁止在证书验证目录放入敏感文件
  if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
      return 403;
  }

  # GoCMS 专有敏感目录与源码保护
  location ~* ^/(data|database|backend|internal|cmd|\.git)/ {
      return 404;
  }

  # 禁止访问的敏感文件
  location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|\.db(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradle|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
  {
      return 404;
  }

  # 禁止访问的敏感目录
  location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
      return 404;
  }

  # 缓存清理路由（支持面板 proxy_cache 清理）
  location ~ /purge(/.*) {
      proxy_cache_purge cache_one $host$request_uri$is_args$args;
  }

  # =========================================================================
  # 反向代理全局通用请求头设置（子 location 自动继承，无需重复编写）
  # =========================================================================
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header REMOTE-HOST $remote_addr;
  proxy_set_header X-Host $host:$server_port;
  proxy_set_header X-Scheme $scheme;
  proxy_connect_timeout 30s;
  proxy_read_timeout 86400s;
  proxy_send_timeout 30s;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # =========================================================================
  # 静态资源缓存策略与分流配置
  # =========================================================================

  # 1. 后台管理与 API 接口：禁止强缓存，确保配置和内容操作实时响应
  location ~* ^/(api/|admin) {
      proxy_pass http://127.0.0.1:18080;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Cache $upstream_cache_status;
  }

  # 2. 上传附件与业务图片：长缓存（30天），文件一旦生成极少修改，有效节省带宽
  location ~* ^/(uploads|images)/ {
      proxy_pass http://127.0.0.1:18080;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, no-transform" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Cache $upstream_cache_status;
  }

  # 3. 主题静态资源（CSS / JS / 皮肤 / 字体）：中等缓存（7天）+ 协商缓存
  location ~* ^/(css|js|skin|assets)/ {
      proxy_pass http://127.0.0.1:18080;
      expires 7d;
      add_header Cache-Control "public, max-age=604800, must-revalidate" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Cache $upstream_cache_status;
      etag on;
  }

  # 4. 前台 HTML 页面与其它默认请求：强制协商缓存（no-cache + must-revalidate）
  # 说明：由浏览器向服务端发起 304 校验，既能秒级感知内容发布更新，又不会重复下载未修改的内容
  location / {
      proxy_pass http://127.0.0.1:18080;
      add_header Cache-Control "no-cache, must-revalidate" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Cache $upstream_cache_status;
      etag on;
  }

  access_log  /www/wwwlogs/gocms.log;
  error_log  /www/wwwlogs/gocms.error.log;
}
