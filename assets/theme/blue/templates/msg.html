<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>在线留言 - {{setting "site_name"}}</title>
<meta name="keywords" content="{{setting "site_keywords"}}" />
<meta name="description" content="{{setting "site_description"}}" />
<link href="/css/c.css" rel="stylesheet" type="text/css" />
</head>
{{include "site-header.html" .}}
<div id="page_main" class="clearfix">
  <div class="page-right page-content">
    <div class="site-nav"><span>当前位置 : </span><a href="/index.html">公司主页</a> - 在线留言</div>
    <h1>在线留言</h1>
    <form id="message-form" class="message-form" method="post" action="/api/messages">
      <p><label for="message-name">姓名</label><input id="message-name" name="name" required></p>
      <p><label for="message-phone">电话</label><input id="message-phone" name="phone" required></p>
      <p><label for="message-mobile">手机</label><input id="message-mobile" name="mobile"></p>
      <p><label for="message-email">邮箱</label><input id="message-email" name="email" type="email"></p>
      <p><label for="message-address">地址</label><input id="message-address" name="address"></p>
      <p><label for="message-title">主题</label><input id="message-title" name="title" required></p>
      <p><label for="message-content">内容</label><textarea id="message-content" name="content" rows="7"></textarea></p>
      <p><button type="submit">提交</button> <span id="message-status" role="status"></span></p>
    </form>
  </div>
  <div class="page-left"><div class="left-content"><h2><span>栏目</span></h2><div id="LeftMenu" class="ddsmoothmenu-v"><ul>{{range navigation .}}<li><a href="{{.URL}}">{{.Name}}</a></li>{{end}}</ul></div></div></div>
</div>
<script type="text/javascript">
const messageForm = document.getElementById("message-form")
const messageStatus = document.getElementById("message-status")
messageForm.addEventListener("submit", async (event) => {
  event.preventDefault()
  messageStatus.textContent = "正在提交..."
  try {
    const response = await fetch(messageForm.action, {method: "POST", body: new FormData(messageForm)})
    const result = await response.json()
    if (!response.ok || !result.ok) throw new Error("submit failed")
    messageForm.reset()
    messageStatus.textContent = "留言已提交"
  } catch {
    messageStatus.textContent = "提交失败，请稍后重试"
  }
})
</script>
{{include "site-footer.html" .}}
