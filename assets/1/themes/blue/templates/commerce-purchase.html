<style>
  .commerce-purchase { margin: 20px 0; padding: 20px; border: 1px solid #d6dfeb; border-radius: 6px; background: #f8fafd; color: #26364b; font-size: 14px; line-height: 1.6; }
  .commerce-purchase[hidden], .commerce-purchase [hidden] { display: none !important; }
  .commerce-purchase h2 { margin: 0 0 16px; padding: 0; font-size: 17px; color: inherit; background: none; }
  .commerce-purchase fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  .commerce-purchase__fields { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; }
  .commerce-purchase label { display: block; margin: 0; }
  .commerce-purchase label span { display: block; margin-bottom: 6px; }
  .commerce-purchase select, .commerce-purchase input { box-sizing: border-box; min-height: 36px; padding: 7px 10px; border: 1px solid #bbc8d8; border-radius: 4px; background: #fff; color: #26364b; font: inherit; line-height: 1.4; }
  .commerce-purchase select { max-width: 100%; min-width: 180px; }
  .commerce-purchase input[type="number"] { width: 90px; }
  .commerce-purchase__variant { flex: 1 1 220px; min-width: 0; }
  .commerce-purchase__variant select { width: 100%; }
  .commerce-purchase__dimensions { display: contents; }
  .commerce-purchase__price { margin: 16px 0 4px; font-size: 22px; font-weight: bold; }
  .commerce-purchase__sku, .commerce-purchase__status { margin: 6px 0; color: #52657c; }
  .commerce-purchase__actions, .commerce-purchase__links { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
  .commerce-purchase button { min-height: 36px; padding: 7px 16px; border: 1px solid #28578e; border-radius: 4px; background: #28578e; color: #fff; font: inherit; cursor: pointer; }
  .commerce-purchase button.commerce-purchase__secondary { background: #fff; color: #28578e; }
  .commerce-purchase button:disabled { opacity: .5; cursor: default; }
  .commerce-purchase a { color: #28578e; text-decoration: underline; text-underline-offset: 3px; }
  .commerce-purchase :is(a, button, select, input):focus-visible { outline: 2px solid #28578e; outline-offset: 3px; }
  @media (max-width: 480px) { .commerce-purchase { padding: 16px; } .commerce-purchase select { min-width: 0; } }
</style>
<section class="commerce-purchase" data-content-id="{{.id}}" aria-label="在线购买" hidden>
  <h2>选择规格与数量</h2>
  <form action="/shop/cart/add" method="get">
    <input type="hidden" name="content_id" value="{{.id}}">
    <input type="hidden" name="return_to" value="{{.content_url}}">
    <fieldset disabled>
      <div class="commerce-purchase__fields">
        <label class="commerce-purchase__variant"><span>规格</span><select name="variant_id" required aria-label="商品规格"></select></label>
        <div class="commerce-purchase__dimensions" data-dimensions hidden></div>
        <label data-currency-field hidden><span>币种</span><select data-currency aria-label="展示币种"></select></label>
        <label><span>数量</span><input name="quantity" type="number" min="1" max="1000" step="1" value="1" required aria-label="购买数量"></label>
      </div>
      <p class="commerce-purchase__price" data-price aria-live="polite"></p>
      <p class="commerce-purchase__status" data-charge hidden></p>
      <p class="commerce-purchase__sku" data-sku hidden></p>
      <div class="commerce-purchase__actions">
        <button type="submit">加入购物车</button>
        <button type="submit" class="commerce-purchase__secondary" name="destination" value="checkout">加入并结算</button>
      </div>
    </fieldset>
  </form>
  <p class="commerce-purchase__status" data-status role="status" aria-live="polite"></p>
  <button type="button" class="commerce-purchase__secondary" data-retry hidden>重新加载规格</button>
  <nav class="commerce-purchase__links" aria-label="购物与会员">
    <a href="/shop/cart">查看购物车</a>
    <a href="/shop/orders">我的订单</a>
    <a href="/shop/login" data-auth="login">登录</a>
    <a href="/shop/register" data-auth="register">注册</a>
  </nav>
</section>
<script>
(() => {
  const panel = document.currentScript.previousElementSibling
  if (!panel || !panel.matches(".commerce-purchase")) return
  const contentID = Number(panel.dataset.contentId)
  if (!Number.isSafeInteger(contentID) || contentID <= 0) return
  const form = panel.querySelector("form")
  const fields = form.querySelector("fieldset")
  const select = form.elements.namedItem("variant_id")
  const dimensionFields = panel.querySelector("[data-dimensions]")
  const quantity = form.elements.namedItem("quantity")
  const price = panel.querySelector("[data-price]")
  const charge = panel.querySelector("[data-charge]")
  const currencySelect = panel.querySelector("[data-currency]")
  const currencyField = panel.querySelector("[data-currency-field]")
  let siteID = 0, manualChoice, queued = false
  const readPreference = key => { try { return localStorage.getItem(key) || "" } catch { return "" } }
  const sku = panel.querySelector("[data-sku]")
  const status = panel.querySelector("[data-status]")
  const retry = panel.querySelector("[data-retry]")
  let variants = [], dimensionControls = [], loading = false, submitting = false
  const returnPath = location.pathname + location.search + location.hash
  form.elements.namedItem("return_to").value = returnPath
  for (const link of panel.querySelectorAll("[data-auth]")) {
    link.href = "/shop/" + link.dataset.auth + "?next=" + encodeURIComponent(returnPath)
  }
  function errorText(value, depth = 0) {
    if (depth > 4) return ""
    if (typeof value === "string") return value.trim() === "[object Object]" ? "" : value.trim()
    if (value && typeof value === "object") return errorText(value.error, depth + 1) || errorText(value.message, depth + 1)
    return ""
  }
  function showPrice() {
    const variant = variants.find(item => String(item.id) === select.value)
    for (const button of form.querySelectorAll('button[type="submit"]')) button.disabled = !variant
    if (!variant) {
      price.textContent = ""; charge.hidden = true; sku.hidden = true
      status.textContent = "此规格组合暂不可购买，请调整选择。"
      return
    }
    const format = (amount, currency) => new Intl.NumberFormat(document.documentElement.lang || "zh-CN", { style: "currency", currency }).format(amount / (currency === "JPY" ? 1 : 100)) + " " + currency
    price.textContent = variant.display_currency ? "约 " + format(variant.display_amount, variant.display_currency) : format(variant.amount, variant.currency)
    charge.hidden = !variant.display_currency && !variant.pricing_unavailable
    charge.textContent = variant.display_currency ? "实际支付 " + format(variant.amount, variant.currency) : variant.pricing_unavailable ? "当前币种暂无有效报价，使用商品原币种结算。" : ""
    sku.textContent = variant.sku ? "规格编号：" + variant.sku : ""
    sku.hidden = !variant.sku
  }
  const specValue = (variant, name) => (variant.specifications || []).find(spec => spec.name.trim().toLowerCase() === name.trim().toLowerCase())?.value || ""
  function chooseDimensions() {
    let candidates = variants
    for (const control of dimensionControls) {
      const available = new Set(candidates.map(item => specValue(item, control.name)))
      for (const option of control.select.options) option.disabled = !available.has(option.value)
      if (!available.has(control.select.value)) control.select.value = control.values.find(value => available.has(value)) || ""
      candidates = candidates.filter(item => specValue(item, control.name) === control.select.value)
    }
    select.value = candidates.length === 1 ? String(candidates[0].id) : ""
    showPrice()
    if (candidates.length === 1) status.textContent = "价格为所选规格的单价。可先加入购物车，结算时再登录。"
  }
  function renderDimensions(dimensions) {
    dimensionControls = []
    dimensionFields.replaceChildren()
    const selected = variants.find(item => String(item.id) === select.value) || variants[0]
    if (!variants.every(item => Array.isArray(item.specifications) && item.specifications.length === dimensions.length && dimensions.every(d => specValue(item, d.name)))) throw new Error("规格数据与维度配置不一致，请联系商家。")
    select.closest("label").hidden = dimensions.length > 0
    dimensionFields.hidden = dimensions.length === 0
    if (!dimensions.length) return
    for (const dimension of dimensions) {
      const values = [...new Set(variants.map(item => specValue(item, dimension.name)))]
      const ordered = [...new Set([...(dimension.options || []).filter(value => values.includes(value)), ...values])]
      const label = document.createElement("label"), title = document.createElement("span"), control = document.createElement("select")
      label.className = "commerce-purchase__variant"
      title.textContent = dimension.name + (dimension.unit ? " (" + dimension.unit + ")" : "")
      control.setAttribute("aria-label", title.textContent)
      control.required = true
      control.replaceChildren(...ordered.map(value => new Option(value, value)))
      control.value = specValue(selected, dimension.name)
      control.addEventListener("change", chooseDimensions)
      label.append(title, control); dimensionFields.append(label)
      dimensionControls.push({ name: dimension.name, values: ordered, select: control })
    }
    chooseDimensions()
  }
  async function load() {
    if (loading) { queued = true; return }
    loading = true; submitting = false; fields.disabled = true; retry.hidden = true
    status.textContent = "正在读取最新规格和价格…"
    try {
      const pricingResponse = await fetch("/api/commerce/pricing", { credentials: "same-origin", cache: "no-store" })
      if (!pricingResponse.ok) throw new Error("币种信息加载失败，请重试")
      let pricing = await pricingResponse.json()
      siteID = Number(pricing.site_id)
      if (!Number.isSafeInteger(siteID) || siteID <= 0) throw new Error("站点信息无效")
      const country = readPreference("gocms-market-country:" + siteID)
      if (/^[A-Z]{2}$/.test(country)) {
        const regional = await fetch("/api/commerce/pricing?country=" + encodeURIComponent(country), { credentials: "same-origin", cache: "no-store" })
        if (regional.ok) pricing = await regional.json()
      }
      const manual = manualChoice !== undefined ? manualChoice : readPreference("gocms-currency:" + siteID)
      const choices = Array.isArray(pricing.currencies) ? pricing.currencies : []
      const selectedCurrency = choices.some(item => item.code === manual) ? manual : pricing.recommended_currency || ""
      currencySelect.replaceChildren(new Option("自动 · " + (pricing.recommended_currency || ""), "auto"), ...choices.map(item => new Option(item.code, item.code)))
      currencySelect.value = choices.some(item => item.code === manual) ? manual : "auto"
      currencyField.hidden = !pricing.enabled
      const catalogURL = "/api/commerce/catalog?content_id=" + encodeURIComponent(contentID) + (selectedCurrency ? "&currency=" + encodeURIComponent(selectedCurrency) : "")
      const offers = []
      let definitions = []
      // Catalog pages remain limited to 50; a product supports up to 500 SKUs.
      for (let page = 1; page <= 10; page++) {
        const response = await fetch(catalogURL + "&page=" + page, { credentials: "same-origin", cache: "no-store" })
        const result = await response.json().catch(() => null)
        if (!response.ok) throw new Error(errorText(result) || "规格加载失败，请重试")
        if (!result || !Array.isArray(result.offers)) throw new Error("规格数据暂不可用，请重试")
        if (page === 1) {
          if (!Array.isArray(result.dimensions)) throw new Error("规格维度配置暂不可用，请重试")
          definitions = result.dimensions
        }
        offers.push(...result.offers)
        if (result.offers.length < 50) break
      }
      variants = [...new Map(offers.filter(item => item.content_id === contentID && Number.isSafeInteger(item.id) && item.id > 0).map(item => [item.id, item])).values()]
      if (!variants.length) { panel.hidden = true; return }
      const selected = select.value
      select.replaceChildren(...variants.map(item => {
        const name = (item.specifications || []).map(spec => spec.name + "：" + spec.value + (spec.unit ? " " + spec.unit : "")).join(" / ") || "标准规格"
        return new Option(name, String(item.id))
      }))
      if (variants.some(item => String(item.id) === selected)) select.value = selected
      renderDimensions(definitions)
      showPrice()
      status.textContent = "价格为所选规格的单价。可先加入购物车，结算时再登录。"
      fields.disabled = false; panel.hidden = false
    } catch (error) {
      price.textContent = ""; charge.hidden = true; sku.hidden = true
      status.textContent = errorText(error) || "规格加载失败，请重试"
      retry.hidden = false; panel.hidden = false
    } finally { loading = false; if (queued) { queued = false; void load() } }
  }
  currencySelect.addEventListener("change", () => {
    manualChoice = currencySelect.value === "auto" ? "" : currencySelect.value
    try { if (manualChoice) localStorage.setItem("gocms-currency:" + siteID, manualChoice); else localStorage.removeItem("gocms-currency:" + siteID) } catch {}
    void load()
  })
  window.addEventListener("storage", event => { if (event.key === null || event.key === "gocms-currency:" + siteID || event.key === "gocms-market-country:" + siteID) { manualChoice = undefined; void load() } })
  select.addEventListener("change", showPrice)
  retry.addEventListener("click", load)
  form.addEventListener("submit", event => {
    if (submitting || fields.disabled || !variants.some(item => String(item.id) === select.value)) { event.preventDefault(); return }
    if (!Number.isInteger(Number(quantity.value)) || Number(quantity.value) < 1 || Number(quantity.value) > 1000) { event.preventDefault(); quantity.reportValidity(); return }
    submitting = true
    status.textContent = "正在前往购物车…"
  })
  window.addEventListener("pageshow", event => { if (event.persisted) { manualChoice = undefined; void load() } })
  void load()
})()
</script>
