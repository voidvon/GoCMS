<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>搜索 - {{setting "site_name"}}</title>
<link href="/css/c.css" rel="stylesheet" type="text/css" />
</head>
{{include "site-header.html" .}}
<div id="page_main" class="clearfix">
  <div class="page-right">
    <div class="site-nav"><span>当前位置 : </span><a href="/index.html">公司主页</a> - 搜索</div>
    <div class="page-content">
      <form id="search-form" method="get" action="/search.html"><p><input id="search-query" name="q" type="text" value="" class="Font_666666_a"><input id="searchbutton" type="submit" value=""></p></form>
      <p id="search-summary" role="status"></p>
      <ul id="search-results" class="content-list"></ul>
      <div id="search-pages" class="page_list"></div>
    </div>
  </div>
  <div class="page-left"><div class="left-content"><h2><span>栏目</span></h2><div id="LeftMenu" class="ddsmoothmenu-v"><ul>{{range navigation .}}<li><a href="{{.URL}}">{{.Name}}</a></li>{{end}}</ul></div></div></div>
</div>
<script type="text/javascript">
const searchForm = document.getElementById("search-form")
const queryInput = document.getElementById("search-query")
const searchSummary = document.getElementById("search-summary")
const searchResults = document.getElementById("search-results")
const searchPages = document.getElementById("search-pages")
const query = new URLSearchParams(location.search).get("q") || ""
queryInput.value = query

function addSearchPage(label, page, current) {
  const link = document.createElement(current ? "span" : "a")
  link.textContent = label
  if (!current) link.href = `/search.html?q=${encodeURIComponent(query)}&page=${page}`
  searchPages.append(link)
}

async function loadSearchResults() {
  const page = Number(new URLSearchParams(location.search).get("page")) || 1
  const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&page=${page}`)
  if (!response.ok) throw new Error("search failed")
  const data = await response.json()
  searchSummary.textContent = `${data.total} 条内容`
  searchResults.replaceChildren()
  for (const item of data.items) {
    const row = document.createElement("li")
    const link = document.createElement("a")
    link.href = item.url || `/api/content/${item.id}`
    link.textContent = item.title
    row.append(link)
    if (item.published_at) {
      const date = document.createElement("time")
      date.textContent = item.published_at.slice(0, 10)
      row.append(date)
    }
    if (item.summary) {
      const excerpt = document.createElement("p")
      excerpt.textContent = item.summary
      row.append(excerpt)
    }
    searchResults.append(row)
  }
  searchPages.replaceChildren()
  const totalPages = Math.max(1, Math.ceil(data.total / data.page_size))
  if (data.page > 1) addSearchPage("上一页", data.page - 1, false)
  for (let number = 1; number <= totalPages; number += 1) addSearchPage(String(number), number, number === data.page)
  if (data.page < totalPages) addSearchPage("下一页", data.page + 1, false)
}

searchForm.addEventListener("submit", (event) => {
  event.preventDefault()
  location.href = `/search.html?q=${encodeURIComponent(queryInput.value.trim())}`
})
loadSearchResults().catch(() => { searchSummary.textContent = "搜索失败，请稍后重试" })
</script>
{{include "site-footer.html" .}}
