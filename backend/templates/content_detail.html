<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{tag "title" .}} - {{tag "hope_webname" .}}</title>
  <meta name="keywords" content="{{tag "keywords" .}}">
  <meta name="description" content="{{tag "description" .}}">
  <link rel="stylesheet" href="/css/c.css">
</head>
<body>
{{tag "bm_indextop" .}}
<main id="page_main" class="clearfix">
  <article class="page-right">
    <nav class="site-nav"><a href="/">首页</a> - <a href="{{tag "category_url" .}}">{{tag "category_name" .}}</a> - {{tag "title" .}}</nav>
    <h1 class="content-title">{{tag "title" .}}</h1>
    <p class="content-meta"><span>{{tag "published_at" .}}</span>{{tag "source" .}}</p>
    <div class="content-summary">{{tag "summary" .}}</div>
    <div class="content-body">{{tag "body" .}}</div>
    <nav class="content-neighbors">上一条：{{tag "previous" .}}　下一条：{{tag "next" .}}</nav>
  </article>
  <aside class="page-left">
    <section class="left-content">
      <h2><span>栏目</span></h2>
      <ul class="ddsmoothmenu-v">{{tag "categories()" .}}</ul>
    </section>
  </aside>
</main>
{{tag "bm_botten" .}}
</body>
</html>
