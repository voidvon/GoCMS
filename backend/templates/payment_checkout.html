<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>购买与订单 - {{setting "site_name"}}</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.6 system-ui,sans-serif; }
    body { margin: 0; background: light-dark(#f6f7f9,#141619); color: light-dark(#20252b,#e5e7eb); }
    main { max-width: 680px; margin: 40px auto; padding: 24px; }
    section { margin: 24px 0; padding: 24px; border: 1px solid light-dark(#dce0e6,#39414b); border-radius: 12px; background: light-dark(white,#1d2229); }
    h1,h2 { line-height: 1.3; } h2 { font-size: 1.2rem; margin-top: 0; }
    label { display: block; margin: 14px 0; } input,select,button { box-sizing: border-box; font: inherit; border-radius: 6px; padding: 10px 12px; }
    input,select { width: 100%; margin-top: 6px; border: 1px solid light-dark(#b9c1cc,#586373); background: transparent; color: inherit; }
    button { cursor: pointer; border: 1px solid light-dark(#a8b4c5,#586373); background: light-dark(#eef2f7,#303a49); color: inherit; margin: 6px 8px 6px 0; }
    button:disabled { cursor: wait; opacity: .55; } #message { white-space: pre-wrap; color: light-dark(#9a3412,#fdba74); }
    .muted { color: light-dark(#526071,#b1bfce); font-size: .9rem; } #order-number { overflow-wrap: anywhere; }
    [hidden] { display: none !important; } a { color: inherit; }
    @media(max-width: 600px) { main { margin: 0; padding: 16px; } section { padding: 18px; } }
  </style>
</head>
<body>
<main>
  <a href="/">{{setting "site_name"}}</a>
  <h1>购买与订单</h1>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="auth" hidden>
    <h2>登录后继续购买</h2>
    <form id="login-form">
      <label>会员用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button type="submit">登录</button><button type="button" id="register">注册会员</button>
    </form>
  </section>
  <section id="purchase" hidden>
    <h2>选择商品或服务</h2>
    <form id="purchase-form">
      <label>商品或服务<select name="content_id" id="product" required></select></label>
      <label>规格<select name="variant_id" id="offer" required></select></label>
      <p class="muted" id="price"></p>
      <label>数量<input name="quantity" type="number" min="1" max="1000" value="1" required></label>
      <label>姓名<input name="customer_name" autocomplete="name" maxlength="100" required></label>
      <label>联系邮箱<input name="email" type="email" autocomplete="email" maxlength="128" required></label>
      <fieldset id="shipping" hidden><legend>收货信息</legend>
        <label>详细地址<input name="street" autocomplete="street-address" maxlength="256"></label>
        <label>城市<input name="city" autocomplete="address-level2" maxlength="50"></label>
        <label>省 / 州<input name="state" autocomplete="address-level1" maxlength="128"></label>
        <label>邮政编码<input name="postcode" autocomplete="postal-code" maxlength="16"></label>
        <label>国家代码（如 CN、US）<input name="country" autocomplete="country" maxlength="2" pattern="[A-Za-z]{2}"></label>
      </fieldset>
      <label>付款渠道<select id="channel" required></select></label>
      <button type="submit" id="buy">创建订单并付款</button>
    </form>
  </section>
  <section id="result" hidden>
    <h2 id="order-status">订单状态</h2>
    <p id="order-number" class="muted"></p><p id="order-item"></p><p id="order-total"></p>
    <p id="order-delivery" class="muted"></p>
    <p class="muted">付款完成后，系统会确认收款结果。若状态尚未更新，可点击同步；请保留此订单，避免重复下单。</p>
    <button id="sync" type="button">同步支付状态</button>
    <button id="retry" type="button" hidden>继续付款</button>
    <button id="new-order" type="button" hidden>开始新的购买</button>
  </section>
  <p id="member" class="muted"></p>
</main>
<script>
(() => {
  const el = (id) => document.getElementById(id)
  const statusNames = { unpaid: "待付款", paid: "付款成功", refunded: "已退款" }
  const deliveryNames = { pending: "等待交付", processing: "正在交付", completed: "已完成交付", failed: "交付处理中，请联系商家" }
  let catalog = { offers: [], channels: [] }, currentOrder = null, member = null, busy = false, pendingAccount = null
  const money = (n, c) => new Intl.NumberFormat(undefined, { style: "currency", currency: c }).format(n / (c === "JPY" ? 1 : 100))
  const storageKey = () => "gocms-order:" + member.id
  async function api(path, options = {}) {
    const response = await fetch(path, { ...options, credentials: "same-origin", headers: { "Content-Type": "application/json", ...options.headers } })
    const data = await response.json()
    if (!response.ok) {
      const error = new Error(typeof data.error === "string" ? data.error : data.error?.message || "操作未完成，请稍后重试")
      error.status = response.status
      throw error
    }
    return data
  }
  async function action(fn) {
    if (busy) return
    busy = true; el("message").textContent = ""
    document.querySelectorAll("button").forEach((b) => { b.disabled = true })
    try { await fn() } catch (e) { el("message").textContent = e.message }
    finally { busy = false; document.querySelectorAll("button").forEach((b) => { b.disabled = false }) }
  }
  const specificationLabel = (item) => item.specifications?.length ? item.specifications.map((spec) => spec.name + "：" + spec.value).join(" / ") : "标准规格"
  function updateProduct() {
    el("offer").replaceChildren()
    for (const variant of catalog.offers.filter((item) => item.content_id === Number(el("product").value))) el("offer").add(new Option(specificationLabel(variant), variant.id))
    updateOffer()
  }
  function updateOffer() {
    const o = catalog.offers.find((i) => i.id === Number(el("offer").value))
    el("channel").replaceChildren()
    if (!o) { el("price").textContent = "暂无可购买的商品或服务"; el("buy").hidden = true; return }
    el("price").textContent = money(o.amount, o.currency)
    el("shipping").hidden = o.kind !== "physical"
    el("shipping").querySelectorAll("input").forEach((input) => { input.required = o.kind === "physical" && input.name !== "state" })
    for (const c of catalog.channels.filter((c) => c.currency === o.currency)) el("channel").add(new Option(c.name + (c.sandbox ? "（沙箱测试）" : ""), c.id))
    el("buy").hidden = !el("channel").options.length
    if (el("buy").hidden) el("price").textContent += " · 暂无可用收款渠道"
  }
  function showOrder(o) {
    currentOrder = o; sessionStorage.setItem(storageKey(), o.id)
    el("purchase").hidden = true; el("result").hidden = false
    el("order-number").textContent = o.id
    el("order-status").textContent = statusNames[o.status] || o.status
    el("order-item").textContent = o.item.name + " · " + specificationLabel(o.item) + " × " + o.quantity
    el("order-total").textContent = money(o.amount, o.currency)
    el("order-delivery").textContent = o.status === "paid" ? deliveryNames[o.fulfillment_status] || o.fulfillment_status : ""
    const active = o.attempts?.find((a) => ["creating", "pending", "failed"].includes(a.status))
    pendingAccount = active?.account_id || catalog.channels.find((c) => c.currency === o.currency)?.id
    el("retry").hidden = o.status !== "unpaid" || !pendingAccount
    el("sync").hidden = o.status !== "unpaid"
    el("new-order").hidden = o.status === "unpaid"
  }
  async function pay() {
    const p = await api("/api/commerce/orders/" + encodeURIComponent(currentOrder.id) + "/pay", { method: "POST", body: JSON.stringify({ account_id: Number(pendingAccount) }) })
    if (!p.payment_url) throw new Error("支付结果待确认，请点击同步状态")
    // The backend validates this signed provider URL before returning it.
    window.location.assign(p.payment_url)
  }
  async function load() {
    const response = await api("/api/v1/me")
    member = response.data
    el("auth").hidden = true; el("member").textContent = "当前会员：" + member.username
    const contentID = new URLSearchParams(location.search).get("content_id")
    catalog = await api("/api/commerce/catalog" + (contentID ? "?content_id=" + encodeURIComponent(contentID) : ""))
    el("product").replaceChildren()
    const products = new Map(catalog.offers.map((item) => [item.content_id, item.name]))
    for (const [id, name] of products) el("product").add(new Option(name, id))
    updateProduct()
    const saved = new URLSearchParams(location.search).get("payment_order") || sessionStorage.getItem(storageKey())
    if (saved) {
      showOrder(await api("/api/commerce/orders/" + encodeURIComponent(saved)))
      if (new URLSearchParams(location.search).has("payment_order") && currentOrder.status === "unpaid") showOrder(await api("/api/commerce/orders/" + encodeURIComponent(saved) + "/sync", { method: "POST", body: "{}" }))
    } else { el("purchase").hidden = false }
  }
  el("product").addEventListener("change", updateProduct)
  el("offer").addEventListener("change", updateOffer)
  el("login-form").addEventListener("submit", (event) => { event.preventDefault(); action(async () => {
    const fields = Object.fromEntries(new FormData(event.target))
    await api("/api/v1/auth/login", { method: "POST", body: JSON.stringify(fields) }); await load()
  }) })
  el("register").addEventListener("click", () => action(async () => {
    const form = el("login-form"); if (!form.reportValidity()) return
    const fields = Object.fromEntries(new FormData(form))
    await api("/api/v1/auth/register", { method: "POST", body: JSON.stringify(fields) })
    await api("/api/v1/auth/login", { method: "POST", body: JSON.stringify(fields) }); await load()
  }))
  el("purchase-form").addEventListener("submit", (event) => { event.preventDefault(); action(async () => {
    const f = Object.fromEntries(new FormData(event.target))
    const input = { content_id: Number(f.content_id), variant_id: Number(f.variant_id), quantity: Number(f.quantity), email: f.email, customer_name: f.customer_name, address: { street: f.street, city: f.city, state: f.state, postcode: f.postcode, country: f.country.toUpperCase() } }
    const body = JSON.stringify(input), keyName = storageKey() + ":request"
    let saved = JSON.parse(sessionStorage.getItem(keyName) || "null")
    if (saved && saved.body !== body) throw new Error("上次下单结果待确认，请恢复原购买信息后重试，或联系商家核查")
    if (!saved) { saved = { body, key: crypto.randomUUID() }; sessionStorage.setItem(keyName, JSON.stringify(saved)) }
    let o
    try { o = await api("/api/commerce/orders", { method: "POST", headers: { "Idempotency-Key": saved.key }, body: saved.body }) }
    catch (error) {
      // These responses confirm the server rejected creation before committing.
      if ([400, 401, 403, 404, 429].includes(error.status)) sessionStorage.removeItem(keyName)
      throw error
    }
    showOrder(o); sessionStorage.removeItem(keyName); pendingAccount = Number(el("channel").value); await pay()
  }) })
  el("retry").addEventListener("click", () => action(pay))
  el("sync").addEventListener("click", () => action(async () => showOrder(await api("/api/commerce/orders/" + encodeURIComponent(currentOrder.id) + "/sync", { method: "POST", body: "{}" }))))
  el("new-order").addEventListener("click", () => { sessionStorage.removeItem(storageKey()); currentOrder = null; const url = new URL(location.href); url.searchParams.delete("payment_order"); history.replaceState(null, "", url); el("result").hidden = true; el("purchase").hidden = false })
  setInterval(async () => { if (!currentOrder || currentOrder.status !== "unpaid" || busy || document.hidden) return; try { showOrder(await api("/api/commerce/orders/" + encodeURIComponent(currentOrder.id))) } catch { /* Keep the last confirmed state visible. */ } }, 5000)
  load().catch((error) => { if (error.status === 401) el("auth").hidden = false; else el("message").textContent = error.message })
})()
</script>
</body>
</html>
