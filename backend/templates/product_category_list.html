<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>{{tag "category_name" .}}_{{tag "hope_webname" .}}</title>
<meta name="keywords" content="{{tag "keywords" .}}" />

<link href="/css/c.css" rel="stylesheet" type="text/css" />
{{tag "bm_indextop" .}}

{{tag "product_categories" .}}
          </ul>
        </div>

      <div class="left-search">
        <h2><span>站内搜索</span></h2>
<form id="form2" name="form2" method="post" action="/Search.asp?action=search">
          <p>
            <input name="ProductsName" type="text" id="ProductsName" value="找找看" size="18"  class="Font_666666_a" onfocus="this.value='';" />
            <input name="searchbutton" type="submit" id="searchbutton" value="" />

      </div><div class="index-contact">

</div></div>

</div>
